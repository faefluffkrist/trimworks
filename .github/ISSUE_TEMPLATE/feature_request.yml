name: Feature Request
description: Suggest an improvement or new feature for Trimworks
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome. Please explain the problem or use case as well as the proposed feature.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or limitation that prompted the suggestion.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Feature
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there other ways this could be handled?

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add examples, screenshots, references, or anything else that helps explain the suggestion.